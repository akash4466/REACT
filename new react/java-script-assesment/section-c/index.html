<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food Delivery Capstone</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="header-content">
      <h1>DeliveryApp</h1>
      <div class="restaurant-selector">
        <label for="restaurantSelect">Deliver from:</label>
        <span id="restaurantLoading" class="status-msg">Loading...</span>
        <span id="restaurantError" class="error-msg" style="display: none;">Error loading restaurants.</span>
        <select id="restaurantSelect" style="display: none;">
          <option value="">Select a restaurant</option>
        </select>
      </div>
      <nav>
        <button id="btnBrowse" class="nav-btn active">Browse Menu</button>
        <button id="btnCart" class="nav-btn">
          View Cart <span id="cartBadge" class="badge">0</span>
        </button>
        <button id="btnClearCart" class="nav-btn danger">Clear Cart</button>
      </nav>
    </div>
  </header>
  <main>
    <section id="sectionBrowse" class="tab-content active">
      <h2>Menu</h2>
      <div id="menuGrid" class="grid-container"></div>
    </section>
    <section id="sectionCart" class="tab-content">
      <h2>Your Cart</h2>
      <div id="cartContainer">
        <ul id="cartList" class="cart-list"></ul>
        <div id="cartSummary" class="cart-summary">
          <h3>Total: <span id="cartTotal">Rs 0</span></h3>
        </div>
        <div id="emptyCartMsg" class="empty-msg" style="display: none;">
          Your cart is empty.
        </div>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
