<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Order Form</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    .error { color: red; font-size: 0.9em; display: none; margin-bottom: 10px; }
    .form-group { margin-bottom: 15px; }
  </style>
</head>
<body>

  <h2>Live Order Form</h2>
  
  <form id="orderForm">
    <div class="form-group">
      <label for="dishName">Dish Name:</label>
      <input type="text" id="dishName" placeholder="e.g. Pasta">
    </div>
    <div class="form-group">
      <label for="quantity">Quantity:</label>
      <input type="number" id="quantity" min="1" placeholder="1">
    </div>
    
    <span id="errorMessage" class="error">Please enter both a dish name and a quantity.</span>
    <br>
    
    <button type="submit" id="addToCartBtn">Add to Cart</button>
  </form>

  <h3>Cart</h3>
  <ul id="cartList">
    <!-- Cart items will appear here -->
  </ul>

  <script src="task3.js"></script>
</body>
</html>
